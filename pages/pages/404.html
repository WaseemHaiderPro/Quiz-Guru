<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page Not Found | Quiz Guru</title>

    <meta
        name="description"
        content="The page you are looking for could not be found on Quiz Guru."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            text-align: center;
        }

        .error-container {
            width: 100%;
            max-width: 600px;
            padding: 50px 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            margin: 0;
            font-size: 90px;
            font-weight: 800;
            color: #4f46e5;
        }

        h1 {
            margin: 10px 0;
            font-size: 32px;
        }

        p {
            margin: 15px 0 30px;
            font-size: 17px;
            line-height: 1.6;
            color: #6b7280;
        }

        .home-button {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 10px;
            background: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }

        .home-button:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .error-container {
                padding: 40px 20px;
            }

            .error-code {
                font-size: 70px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="error-container">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for does not exist.
            Let's get you back to Quiz Guru.
        </p>

        <a
            href="../index.html"
            class="home-button"
        >
            Back to Quiz Guru
        </a>

    </main>

</body>
</html>

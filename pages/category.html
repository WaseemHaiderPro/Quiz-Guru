<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Guru - Category</title>

    <meta
        name="description"
        content="Explore quizzes by category on Quiz Guru."
    >

    <link rel="stylesheet" href="../css/style.css">
    <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23756cff'/%3E%3Cstop offset='100%25' stop-color='%235148e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='Arial,sans-serif' font-size='62' font-weight='900' fill='white'%3EQ%3C/text%3E%3C/svg%3E"
>
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <a href="../index.html" class="brand">

            <span class="brand-mark">
                Q
            </span>

            <span class="brand-name">
                Quiz<span>Guru</span>
            </span>

        </a>


        <nav class="main-nav">

            <a href="../index.html">
                Home
            </a>

            <a href="../index.html#quizzes">
                Quizzes
            </a>

            <a href="../index.html#categories">
                Categories
            </a>

            <a href="../index.html#about">
                About
            </a>

        </nav>


        <div class="header-actions">

            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                aria-label="Switch to dark mode"
                title="Toggle dark mode"
            >
                <span class="theme-toggle-track">

                    <span class="theme-toggle-icon theme-toggle-moon">
                        ☾
                    </span>

                    <span class="theme-toggle-icon theme-toggle-sun">
                        ☀
                    </span>

                    <span class="theme-toggle-knob"></span>

                </span>
            </button>


            <a
                href="all-quizzes.html"
                class="header-button"
            >
                Explore Quizzes
            </a>

        </div>

    </div>

</header>


<main>

    <section class="section">

        <div class="container">

            <div class="section-header">

                <div>

                    <span
                        id="categoryLabel"
                        class="section-kicker"
                    >
                        CATEGORY
                    </span>

                    <h1 id="categoryTitle">
                        Loading...
                    </h1>

                </div>


                <a
                    href="../index.html#categories"
                    class="view-link"
                >
                    ← All Categories
                </a>

            </div>


            <div
                id="categoryQuizGrid"
                class="quiz-grid"
            >

                <p>
                    Loading quizzes...
                </p>

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container footer-content">

        <div>

            <a
                href="../index.html"
                class="logo"
            >
                Quiz<span>Guru</span>
            </a>

            <p>
                Learn. Practice. Challenge Yourself.
            </p>

        </div>

    </div>


    <div class="container copyright">

        <p>
            © 2026 Quiz Guru. All rights reserved.
        </p>

    </div>

</footer>


<script src="../js/theme.js"></script>
<script src="../js/category.js"></script>

</body>

</html>
